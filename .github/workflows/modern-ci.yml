name: Life100 React CI
on:
  pull_request:
    paths:
      - 'modern/**'
      - '.github/workflows/modern-ci.yml'
      - '.github/workflows/modern-pages.yml'
  push:
    branches: [main]
    paths:
      - 'modern/**'
      - '.github/workflows/modern-ci.yml'
      - '.github/workflows/modern-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: life100-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve lockfile if bootstrapping
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: life100-package-lock
          path: modern/package-lock.json
          if-no-files-found: ignore
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: modern/test-results/
          if-no-files-found: ignore
